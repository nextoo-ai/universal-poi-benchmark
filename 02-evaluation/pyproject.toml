[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poi-evaluator"
version = "0.1.0"
description = "Deterministic SQLite pipeline for evaluating POI datasets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "POI Evaluator contributors"}]
dependencies = []

[project.scripts]
poi-evaluator = "poi_evaluator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poi_evaluator = ["py.typed"]

[tool.setuptools.data-files]
"share/poi-evaluator/schema" = ["schema/001_initial.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
